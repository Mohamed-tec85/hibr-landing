<script>
let revealObserver;
function observeReveals(){
  if(revealObserver) revealObserver.disconnect();
  revealObserver = new IntersectionObserver((entries) => {
    entries.forEach((entry, i) => {
      if(entry.isIntersecting){
        setTimeout(() => entry.target.classList.add('visible'), i * 80);
        revealObserver.unobserve(entry.target);
      }
    });
  }, { threshold: 0.12 });
  document.querySelectorAll('.reveal:not(.visible)').forEach(el => revealObserver.observe(el));
}

// Encode form data for Netlify Forms
function encodeFormData(data){
  return Object.keys(data)
    .map(key => encodeURIComponent(key) + '=' + encodeURIComponent(data[key]))
    .join('&');
}

// Handle form submission via AJAX (prevents 404 page)
document.getElementById('contactForm').addEventListener('submit', async function(e){
  e.preventDefault();

  const form = e.target;
  const submitBtn = form.querySelector('button[type="submit"]');
  const lang = getCurrentLang();

  // Disable button and show loading state
  const originalBtnHTML = submitBtn.innerHTML;
  submitBtn.disabled = true;
  submitBtn.innerHTML = `
    <span>${lang === 'ar' ? 'جاري الإرسال...' : 'Sending...'}</span>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="animation:spin 1s linear infinite">
      <path d="M21 12a9 9 0 11-6.219-8.56"/>
    </svg>
  `;

  // Collect form data
  const formData = new FormData(form);
  // Ensure form-name is set (required by Netlify Forms)
  formData.set('form-name', 'contact');

  const data = {};
  formData.forEach((value, key) => { data[key] = value; });

  try {
    // Submit to Netlify Forms via AJAX
    // POST to current page URL (Netlify intercepts based on form-name)
    const response = await fetch('/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: encodeFormData(data)
    });

    // Netlify returns 200 OK on success
    // Sometimes returns 303 redirect — both are success
    if(response.ok || response.status === 200 || response.status === 303 || response.redirected){
      // Hide form, show beautiful success modal
      showSuccessModal();
      form.reset();
      submitBtn.disabled = false;
      submitBtn.innerHTML = originalBtnHTML;
    } else {
      // Try fallback: submit form normally as last resort
      console.error('Netlify Forms returned status:', response.status);
      throw new Error('Submission failed with status: ' + response.status);
    }
  } catch(error){
    console.error('Form submission error:', error);
    // Show friendly error with email fallback
    alert(lang === 'ar'
      ? 'تعذّر الإرسال عبر النموذج. يرجى التواصل معنا مباشرة على: hello@chattlle.com'
      : 'Form submission failed. Please contact us directly at: hello@chattlle.com');
    submitBtn.disabled = false;
    submitBtn.innerHTML = originalBtnHTML;
  }
});

// Show success modal with luxury design
function showSuccessModal(){
  const lang = getCurrentLang();
  const modal = document.createElement('div');
  modal.className = 'success-modal-overlay';
  modal.innerHTML = `
    <div class="success-modal">
      <div class="success-icon-wrap">
        <svg class="success-checkmark" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <h2 class="success-title">${lang === 'ar' ? '✓ تم إرسال رسالتك بنجاح!' : '✓ Message Sent Successfully!'}</h2>
      <p class="success-text">${lang === 'ar'
        ? 'شكرًا لتواصلك معنا. سيقوم فريقنا بالرد على استفسارك خلال 24 ساعة كحدّ أقصى على بريدك الإلكتروني.'
        : 'Thank you for reaching out. Our team will respond to your inquiry within 24 hours via email.'}</p>
      <div class="success-actions">
        <a href="index.html" class="btn-primary">
          <span>${lang === 'ar' ? 'العودة للرئيسية' : 'Back to Home'}</span>
        </a>
        <button type="button" class="btn-secondary" onclick="closeSuccessModal()">
          <span>${lang === 'ar' ? 'إغلاق' : 'Close'}</span>
        </button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
  document.body.style.overflow = 'hidden';
  // Trigger animation
  setTimeout(() => modal.classList.add('show'), 10);
}

function closeSuccessModal(){
  const modal = document.querySelector('.success-modal-overlay');
  if(modal){
    modal.classList.remove('show');
    setTimeout(() => {
      modal.remove();
      document.body.style.overflow = '';
    }, 300);
  }
}

// Legacy: check if returned from successful submission (fallback)
if(window.location.search.includes('contact=success') || window.location.search.includes('success=true')){
  setTimeout(() => showSuccessModal(), 300);
  // Clean URL
  if(window.history.replaceState){
    window.history.replaceState({}, '', window.location.pathname);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  initLangSwitcher();
  observeReveals();
  const nav = document.querySelector('nav');
  window.addEventListener('scroll', () => {
    nav.style.background = window.scrollY > 50 ? 'rgba(10,6,19,.9)' : 'rgba(10,6,19,.7)';
  });
});
</script>
</body>
</html>
