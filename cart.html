<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%25%27 y1=%270%25%27 x2=%27100%25%27 y2=%27100%25%27%3E%3Cstop offset=%270%25%27 stop-color=%27%23e8c178%27/%3E%3Cstop offset=%27100%25%27 stop-color=%27%237b3fff%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx=%2750%27 cy=%2750%27 r=%2745%27 fill=%27url(%23g)%27/%3E%3Ctext x=%2750%27 y=%2765%27 font-family=%27Georgia,serif%27 font-size=%2750%27 font-style=%27italic%27 text-anchor=%27middle%27 fill=%27%230a0613%27 font-weight=%27bold%27%3EC%3C/text%3E%3C/svg%3E">

<style>
  .cart-layout{
    display:grid;
    grid-template-columns: 1fr 380px;
    gap:2.5rem;
    align-items:start;
  }

  .cart-items{
    display:flex;
    flex-direction:column;
    gap:1rem;
  }

  .cart-item{
    background: rgba(245,239,227,.04);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:1.2rem;
    display:grid;
    grid-template-columns: 100px 1fr auto;
    gap:1.2rem;
    align-items:center;
    transition: all .3s;
  }
  .cart-item:hover{ border-color: rgba(232,193,120,.2) }

  .cart-item-img{
    width:100px;
    aspect-ratio:1;
    border-radius:14px;
    overflow:hidden;
    position:relative;
  }
  .cart-item-img .gradient{ position:absolute; inset:0 }
  .cart-item-img .ic{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:2.4rem;
  }

  .cart-item-info .cat{
    color: var(--gold);
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:.85rem;
    margin-bottom:.25rem;
  }
  .cart-item-info h3{
    font-size:1.05rem;
    margin-bottom:.4rem;
    line-height:1.3;
  }
  html[lang="ar"] .cart-item-info h3{ font-family:'Reem Kufi', sans-serif }
  html[lang="en"] .cart-item-info h3{ font-family:'Fraunces', serif; font-weight:600 }
  .cart-item-info h3 a{
    color:inherit;
    text-decoration:none;
    transition: color .3s;
  }
  .cart-item-info h3 a:hover{ color: var(--gold) }
  .cart-item-info .pr{
    color: var(--ink-mute);
    font-family:'Cormorant Garamond', serif;
    font-size:1rem;
  }

  .cart-item-actions{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:.8rem;
    text-align:end;
  }

  .qty-mini{
    display:inline-flex;
    align-items:center;
    background: rgba(245,239,227,.04);
    border:1px solid var(--line);
    border-radius:100px;
    overflow:hidden;
    direction:ltr;
  }
  .qty-mini button{
    background:transparent;
    border:none;
    color:var(--ink);
    width:30px;height:30px;
    font-size:1rem;
    cursor:pointer;
    transition: background .2s;
  }
  .qty-mini button:hover{ background: rgba(232,193,120,.15) }
  .qty-mini span{
    min-width:28px;
    text-align:center;
    font-weight:600;
    font-family:'Outfit', sans-serif;
    font-size:.9rem;
  }

  .line-total{
    font-family:'Cormorant Garamond', serif;
    font-size:1.3rem;
    font-weight:600;
    color: var(--gold);
  }

  .remove-btn{
    background:transparent;
    border:none;
    color: var(--ink-mute);
    cursor:pointer;
    padding:.3rem .5rem;
    font-size:.85rem;
    transition: color .3s;
    font-family:inherit;
  }
  .remove-btn:hover{ color: var(--red) }

  /* Summary card */
  .summary-card{
    background: rgba(245,239,227,.04);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:1.8rem;
    position:sticky;
    top:6rem;
  }
  .summary-card h3{
    font-size:1.3rem;
    margin-bottom:1.2rem;
    padding-bottom:1.2rem;
    border-bottom:1px solid var(--line);
  }
  html[lang="ar"] .summary-card h3{ font-family:'Reem Kufi', sans-serif; font-weight:600 }
  html[lang="en"] .summary-card h3{ font-family:'Fraunces', serif; font-weight:600 }

  .summary-row{
    display:flex;
    justify-content:space-between;
    margin-bottom:.8rem;
    color: var(--ink-mute);
  }
  .summary-row.total{
    padding-top:1rem;
    margin-top:1rem;
    border-top:1px solid var(--line);
    color: var(--ink);
    font-size:1.2rem;
    font-weight:600;
  }
  .summary-row.total .amt{
    font-family:'Cormorant Garamond', serif;
    color: var(--gold);
    font-size:1.6rem;
  }
  .summary-row .amt{
    font-family:'Cormorant Garamond', serif;
    color: var(--ink);
    font-size:1.05rem;
  }

  .coupon-row{
    display:flex;
    gap:.5rem;
    margin:1.2rem 0;
  }
  .coupon-row input{
    flex:1;
    background: rgba(245,239,227,.04);
    border:1px solid var(--line);
    color: var(--ink);
    padding:.7rem 1rem;
    border-radius:100px;
    font-family:inherit;
    font-size:.9rem;
    outline:none;
    transition: border .3s;
  }
  .coupon-row input:focus{ border-color: var(--gold) }
  .coupon-row button{
    background: var(--ink);
    color: var(--bg-deep);
    border:none;
    padding:.7rem 1.2rem;
    border-radius:100px;
    font-family:inherit;
    font-weight:600;
    cursor:pointer;
    font-size:.9rem;
    transition: all .3s;
  }
  .coupon-row button:hover{ background: var(--gold) }

  .summary-card .btn-primary{
    width:100%;
    margin-top:1rem;
  }

  .secure-note{
    text-align:center;
    color: var(--ink-mute);
    font-size:.85rem;
    margin-top:1rem;
  }

  .clear-row{
    display:flex;
    justify-content:flex-end;
    margin-top:1.5rem;
  }
  .clear-row button{
    background:transparent;
    border:1px solid var(--line);
    color: var(--ink-mute);
    padding:.6rem 1.2rem;
    border-radius:100px;
    cursor:pointer;
    font-family:inherit;
    font-size:.85rem;
    transition: all .3s;
  }
  .clear-row button:hover{
    border-color: var(--red);
    color: var(--red);
  }

  /* Empty state */
  .empty-cart{
    text-align:center;
    padding:5rem 0;
  }
  .empty-cart .ico{
    font-size:5rem;
    opacity:.5;
    margin-bottom:1rem;
  }
  .empty-cart h2{
    font-size:2rem;
    margin-bottom:.8rem;
  }
  html[lang="ar"] .empty-cart h2{ font-family:'Reem Kufi', sans-serif; font-weight:700 }
  html[lang="en"] .empty-cart h2{ font-family:'Fraunces', serif; font-weight:600 }
  .empty-cart p{
    color: var(--ink-mute);
    margin-bottom:2rem;
  }

  @media (max-width: 900px){
    .cart-layout{ grid-template-columns:1fr; gap:1.5rem }
    .summary-card{ position:static }
    .cart-item{
      grid-template-columns: 80px 1fr;
      gap:1rem;
    }
    .cart-item-actions{
      grid-column: 1 / -1;
      flex-direction:row;
      justify-content:space-between;
      align-items:center;
      padding-top:.8rem;
      border-top:1px solid var(--line);
    }
    .cart-item-img{ width:80px }
  }
</style>

<script>
function renderCart(){
  const lang = getCurrentLang();
  const cartData = getCartDetailed();
  const container = document.getElementById('cartContent');

  if(cartData.length === 0){
    container.innerHTML = `
      <div class="empty-cart">
        <div class="ico">🛒</div>
        <h2>${getText('cart.empty', lang)}</h2>
        <p>${getText('cart.emptyDesc', lang)}</p>
        <a href="index.html#products" class="btn-primary">
          ${getText('btn.continueShopping', lang)}
          <svg class="arrow-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </a>
      </div>
    `;
    return;
  }

  const itemsHtml = cartData.map(item => {
    const t = item.product[lang];
    const itemVisual = item.product.imageUrl
      ? `<img src="${item.product.imageUrl}" alt="${t.title}" style="width:100%;height:100%;object-fit:cover;position:absolute;inset:0">`
      : `<div class="gradient ${item.product.gradient}"></div><div class="ic">${item.product.icon}</div>`;
    return `
      <div class="cart-item" data-id="${item.id}">
        <div class="cart-item-img">
          ${itemVisual}
        </div>
        <div class="cart-item-info">
          <div class="cat">${getText('cat.' + item.product.category, lang)}</div>
          <h3><a href="product.html?id=${item.id}">${t.title}</a></h3>
          <div class="pr">${formatPrice(item.product.prices.current, lang)} × ${item.qty}</div>
        </div>
        <div class="cart-item-actions">
          <div class="qty-mini">
            <button class="qty-minus" data-id="${item.id}">−</button>
            <span>${item.qty}</span>
            <button class="qty-plus" data-id="${item.id}">+</button>
          </div>
          <div class="line-total">${formatPrice(item.lineTotal, lang)}</div>
          <button class="remove-btn" data-id="${item.id}">✕ ${getText('cart.remove', lang)}</button>
        </div>
      </div>
    `;
  }).join('');

  const subtotal = getCartSubtotal();
  const vat = getCartVAT();
  const total = getCartTotal();

  container.innerHTML = `
    <div class="cart-layout">
      <div>
        <div class="cart-items">${itemsHtml}</div>
        <div class="clear-row">
          <button id="clearCartBtn">${getText('cart.clear', lang)}</button>
        </div>
      </div>

      <div class="summary-card">
        <h3>${getText('cart.summary', lang)}</h3>

        <div class="summary-row">
          <span>${getText('cart.subtotal', lang)}</span>
          <span class="amt">${formatPrice(subtotal.toFixed(2), lang)}</span>
        </div>
        <div class="summary-row">
          <span>${getText('cart.vat', lang)}</span>
          <span class="amt">${formatPrice(vat.toFixed(2), lang)}</span>
        </div>

        <div class="coupon-row">
          <input type="text" placeholder="${getText('cart.couponPlaceholder', lang)}" id="couponInput">
          <button id="applyCouponBtn">${getText('cart.apply', lang)}</button>
        </div>

        <div class="summary-row total">
          <span>${getText('cart.total', lang)}</span>
          <span class="amt">${formatPrice(total.toFixed(2), lang)}</span>
        </div>

        <a href="checkout.html" class="btn-primary">
          ${getText('btn.checkout', lang)}
          <svg class="arrow-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </a>

        <div class="secure-note">${getText('cart.secureCheckout', lang)}</div>
      </div>
    </div>
  `;

  // attach handlers
  container.querySelectorAll('.qty-minus').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = parseInt(btn.dataset.id);
      const item = getCart().find(i => i.id === id);
      if(item && item.qty > 1){
        updateQuantity(id, item.qty - 1);
        renderCart();
      } else if(item && item.qty === 1){
        removeFromCart(id);
        renderCart();
      }
    });
  });
  container.querySelectorAll('.qty-plus').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = parseInt(btn.dataset.id);
      const item = getCart().find(i => i.id === id);
      if(item){
        updateQuantity(id, item.qty + 1);
        renderCart();
      }
    });
  });
  container.querySelectorAll('.remove-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = parseInt(btn.dataset.id);
      removeFromCart(id);
      renderCart();
    });
  });
  const clearBtn = document.getElementById('clearCartBtn');
  if(clearBtn) clearBtn.addEventListener('click', () => {
    clearCart();
    renderCart();
  });
  const couponBtn = document.getElementById('applyCouponBtn');
  if(couponBtn) couponBtn.addEventListener('click', () => {
    showToast(lang === 'ar' ? 'كود الخصم غير صالح' : 'Invalid coupon code', '✕');
  });
}

document.addEventListener('DOMContentLoaded', async () => {
  initLangSwitcher('cart');

  // Load products from Supabase so we can resolve cart items
  await loadProducts();
  renderCart();

  const nav = document.querySelector('nav');
  window.addEventListener('scroll', () => {
    nav.style.background = window.scrollY > 50 ? 'rgba(10,6,19,.9)' : 'rgba(10,6,19,.7)';
  });
});

document.addEventListener('langChanged', renderCart);
</script>
