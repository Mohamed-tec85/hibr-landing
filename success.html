<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تم الطلب بنجاح — Chattlle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;500;600;700&family=Tajawal:wght@300;400;500;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Fraunces:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%25%27 y1=%270%25%27 x2=%27100%25%27 y2=%27100%25%27%3E%3Cstop offset=%270%25%27 stop-color=%27%23e8c178%27/%3E%3Cstop offset=%27100%25%27 stop-color=%27%237b3fff%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx=%2750%27 cy=%2750%27 r=%2745%27 fill=%27url(%23g)%27/%3E%3Ctext x=%2750%27 y=%2765%27 font-family=%27Georgia,serif%27 font-size=%2750%27 font-style=%27italic%27 text-anchor=%27middle%27 fill=%27%230a0613%27 font-weight=%27bold%27%3EC%3C/text%3E%3C/svg%3E">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="assets/styles.css">
<style>
  .success-page{
    min-height: 100vh;
    display:flex;
    align-items:center;
    padding: 8rem 0 4rem;
  }
  .success-content{
    text-align:center;
    max-width:720px;
    margin:0 auto;
  }

  /* Success animation */
  .check-circle{
    width:120px;
    height:120px;
    border-radius:50%;
    background: linear-gradient(135deg, var(--gold), var(--violet));
    margin:0 auto 2rem;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    animation: checkPop .6s cubic-bezier(.5,1.6,.4,1);
    box-shadow: 0 20px 60px rgba(232,193,120,.3);
  }
  .check-circle::before, .check-circle::after{
    content:"";
    position:absolute;
    border-radius:50%;
    border: 2px solid var(--gold);
    opacity: 0;
    inset: 0;
    animation: ripple 2s ease-out infinite;
  }
  .check-circle::after{ animation-delay: .6s }
  .check-mark{
    color: var(--bg-deep);
    font-size: 4rem;
    font-weight:700;
    animation: checkDraw .8s ease-out .2s both;
  }
  @keyframes checkPop{
    0%{ transform:scale(0); opacity:0 }
    60%{ transform:scale(1.1); opacity:1 }
    100%{ transform:scale(1); opacity:1 }
  }
  @keyframes checkDraw{
    0%{ opacity:0; transform:scale(.5) }
    100%{ opacity:1; transform:scale(1) }
  }
  @keyframes ripple{
    0%{ transform:scale(1); opacity:.6 }
    100%{ transform:scale(1.6); opacity:0 }
  }

  .success-content h1{
    font-size: clamp(2rem, 4.5vw, 3.2rem);
    margin-bottom: 1rem;
    background: linear-gradient(120deg, var(--gold), var(--gold-soft), var(--violet-glow));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  html[lang="ar"] .success-content h1{ font-family:'Reem Kufi', sans-serif; font-weight:700 }
  html[lang="en"] .success-content h1{ font-family:'Fraunces', serif; font-weight:600; font-style:italic }

  .success-content .thanks{
    color: var(--ink-mute);
    font-size: 1.15rem;
    margin-bottom: 2.5rem;
  }

  .order-card{
    background: rgba(245,239,227,.04);
    border:1px solid var(--gold);
    border-radius: 24px;
    padding: 2rem;
    margin: 2rem 0;
    text-align: start;
    position:relative;
    overflow:hidden;
  }
  .order-card::before{
    content:"";
    position:absolute;
    inset:0;
    background: radial-gradient(circle at top right, rgba(232,193,120,.1), transparent 60%);
    pointer-events:none;
  }
  .order-card > *{ position:relative }

  .order-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-bottom:1.2rem;
    margin-bottom:1.2rem;
    border-bottom:1px solid var(--line);
    flex-wrap:wrap;
    gap:.8rem;
  }
  .order-id-label{
    color: var(--ink-mute);
    font-size:.85rem;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    margin-bottom:.2rem;
  }
  .order-id{
    font-family:'Outfit', sans-serif;
    font-size:1.4rem;
    font-weight:700;
    color: var(--gold);
    letter-spacing:.02em;
    direction:ltr;
  }
  .order-date{
    color: var(--ink-mute);
    font-size:.85rem;
  }

  .order-items{
    display:flex;
    flex-direction:column;
    gap:1rem;
    margin-bottom:1.5rem;
  }
  .order-item{
    display:grid;
    grid-template-columns: 56px 1fr auto;
    gap:1rem;
    align-items:center;
  }
  .order-item .img{
    width:56px;
    height:56px;
    border-radius:12px;
    position:relative;
    overflow:hidden;
  }
  .order-item .img .gradient{ position:absolute; inset:0 }
  .order-item .img .ic{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.6rem;
  }
  .order-item .info .nm{
    font-weight:600;
    font-size:.95rem;
    margin-bottom:.15rem;
  }
  .order-item .info .meta{
    color: var(--ink-mute);
    font-size:.82rem;
  }
  .order-item .download-btn{
    background: transparent;
    border:1px solid var(--gold);
    color: var(--gold);
    padding:.5rem 1rem;
    border-radius:100px;
    text-decoration:none;
    font-size:.85rem;
    font-weight:600;
    cursor:pointer;
    transition: all .3s;
    display:inline-flex;
    align-items:center;
    gap:.4rem;
    font-family: inherit;
    white-space: nowrap;
  }
  .order-item .download-btn:hover:not(:disabled){
    background: var(--gold);
    color: var(--bg-deep);
  }
  .order-item .download-btn:disabled{
    cursor: wait;
  }

  .order-totals{
    padding-top:1.2rem;
    border-top:1px solid var(--line);
  }
  .total-row{
    display:flex;
    justify-content:space-between;
    margin-bottom:.6rem;
    color: var(--ink-mute);
    font-size:.95rem;
  }
  .total-row.grand{
    padding-top:.8rem;
    margin-top:.8rem;
    border-top:1px solid var(--line);
    color: var(--ink);
    font-size:1.15rem;
    font-weight:600;
  }
  .total-row .amt{
    font-family:'Cormorant Garamond', serif;
  }
  .total-row.grand .amt{
    color: var(--gold);
    font-size:1.5rem;
  }

  .email-note{
    background: rgba(123,63,255,.1);
    border:1px solid rgba(123,63,255,.3);
    border-radius:14px;
    padding:1rem 1.4rem;
    color: var(--ink);
    font-size:.92rem;
    margin: 1.5rem 0;
    text-align:center;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:.6rem;
  }

  .success-actions{
    display:flex;
    gap:1rem;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:2rem;
  }

  .support-line{
    margin-top:3rem;
    color: var(--ink-mute);
    font-size:.95rem;
  }
  .support-line a{
    color: var(--gold);
    text-decoration:none;
    font-weight:600;
  }
  .support-line a:hover{ text-decoration:underline }

  /* No order state */
  .no-order{
    text-align:center;
    padding:6rem 0;
  }
  .no-order h2{
    font-size:2rem;
    margin-bottom:1rem;
  }
  html[lang="ar"] .no-order h2{ font-family:'Reem Kufi', sans-serif }
  html[lang="en"] .no-order h2{ font-family:'Fraunces', serif; font-weight:600 }

  @media (max-width: 600px){
    .order-card{ padding:1.4rem }
    .order-header{ flex-direction:column; align-items:flex-start }
    .order-item{ grid-template-columns: 50px 1fr; gap:.8rem }
    .order-item .download-btn{
      grid-column: 1 / -1;
      justify-content:center;
    }
  }
</style>
</head>
<body>

<!-- NAV (minimal) -->
<nav>
  <div class="container nav-inner">
    <a href="index.html" class="logo">
      <span class="logo-dot"></span>
      <span class="latin">Chattlle</span>
    </a>
    <div class="nav-right" style="margin-inline-start:auto">
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" data-lang="ar" class="active">AR</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </div>
  </div>
</nav>

<!-- SUCCESS -->
<section class="success-page">
  <div class="container">
    <div id="successContent"></div>
  </div>
</section>

<!-- FOOTER -->
<footer>
  <div class="container">
    <div class="foot-bottom">
      <div data-i18n="footer.copy"></div>
      <div class="socials">
        <a href="#" aria-label="Twitter">𝕏</a>
        <a href="#" aria-label="Instagram">◎</a>
      </div>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/i18n.js"></script>
<script src="assets/supabase.js"></script>
<script src="assets/products.js"></script>
<script src="assets/cart.js"></script>
<script src="assets/back-to-top.js"></script>
<script>
function renderSuccess(){
  const lang = getCurrentLang();
  const order = getLastOrder();
  const container = document.getElementById('successContent');

  if(!order){
    container.innerHTML = `
      <div class="no-order">
        <div style="font-size:4rem;margin-bottom:1rem;opacity:.5">📭</div>
        <h2>${lang === 'ar' ? 'لا يوجد طلب' : 'No Order Found'}</h2>
        <p style="color:var(--ink-mute);margin-bottom:2rem">${lang === 'ar' ? 'لم نجد أي طلب حديث' : "We couldn't find any recent order"}</p>
        <a href="index.html" class="btn-primary">${getText('btn.backHome', lang)}</a>
      </div>
    `;
    return;
  }

  const date = new Date(order.date);
  const dateStr = date.toLocaleDateString(lang === 'ar' ? 'ar-SA' : 'en-US', {
    year: 'numeric',
    month: 'long',
    day: 'numeric',
    hour: '2-digit',
    minute: '2-digit'
  });

  const itemsHtml = order.items.map((item, idx) => {
    const t = item.product[lang];
    const orderItemVisual = item.product.imageUrl
      ? `<img src="${item.product.imageUrl}" alt="${t.title}" style="width:100%;height:100%;object-fit:cover;position:absolute;inset:0">`
      : `<div class="gradient ${item.product.gradient}"></div><div class="ic">${item.product.icon}</div>`;
    const hasFile = !!item.product.fileUrl;
    const downloadBtn = hasFile
      ? `<button class="download-btn" data-file="${item.product.fileUrl}" data-name="${t.title.replace(/"/g, '&quot;')}" data-idx="${idx}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          <span>${getText('success.download', lang)}</span>
        </button>`
      : `<div class="download-btn" style="opacity:.4;cursor:not-allowed">
          <span style="font-size:.8rem">${lang === 'ar' ? 'الملف غير متوفر' : 'File unavailable'}</span>
        </div>`;
    return `
      <div class="order-item">
        <div class="img">
          ${orderItemVisual}
        </div>
        <div class="info">
          <div class="nm">${t.title}</div>
          <div class="meta">${t.format} · ${t.size}</div>
        </div>
        ${downloadBtn}
      </div>
    `;
  }).join('');

  container.innerHTML = `
    <div class="success-content">
      <div class="check-circle">
        <div class="check-mark">✓</div>
      </div>

      <h1>${getText('success.title', lang)}</h1>
      <p class="thanks">${getText('success.thanks', lang)}، ${order.customer.name}</p>

      <div class="order-card">
        <div class="order-header">
          <div>
            <div class="order-id-label">${getText('success.orderNum', lang)}</div>
            <div class="order-id">${order.id}</div>
          </div>
          <div class="order-date">${dateStr}</div>
        </div>

        <div class="order-items">${itemsHtml}</div>

        <div class="order-totals">
          <div class="total-row">
            <span>${getText('cart.subtotal', lang)}</span>
            <span class="amt">${formatPrice(order.subtotal.toFixed(2), lang)}</span>
          </div>
          <div class="total-row">
            <span>${getText('cart.vat', lang)}</span>
            <span class="amt">${formatPrice(order.vat.toFixed(2), lang)}</span>
          </div>
          <div class="total-row grand">
            <span>${getText('cart.total', lang)}</span>
            <span class="amt">${formatPrice(order.total.toFixed(2), lang)}</span>
          </div>
        </div>
      </div>

      <div class="email-note">
        <span style="font-size:1.2rem">✉️</span>
        ${getText('success.emailSent', lang)}
      </div>

      <div class="success-actions">
        <a href="index.html#products" class="btn-primary">
          ${getText('btn.continueShopping', lang)}
          <svg class="arrow-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </a>
        <a href="index.html" class="btn-outline">${getText('btn.backHome', lang)}</a>
      </div>

      <div class="support-line">
        ${getText('success.support', lang)} <a href="#">${getText('success.contactUs', lang)}</a>
      </div>
    </div>
  `;

  // Attach download handlers
  attachDownloadHandlers();
}

async function handleDownload(btn){
  const lang = getCurrentLang();
  const filePath = btn.dataset.file;
  const fileName = btn.dataset.name || 'product';

  if(!filePath){
    showToast(lang === 'ar' ? 'الملف غير متوفر' : 'File unavailable', '✕');
    return;
  }

  // Show loading state
  const originalHtml = btn.innerHTML;
  btn.disabled = true;
  btn.style.opacity = '.6';
  btn.style.cursor = 'wait';
  btn.innerHTML = `<span style="font-size:.85rem">${lang === 'ar' ? 'جاري التحضير...' : 'Preparing...'}</span>`;

  try {
    // Generate temporary signed URL (1 hour validity)
    const result = await sbGetSignedFileUrl(filePath, 3600);

    if(result.success && result.url){
      // Trigger download by opening URL — browser handles the file based on type
      const link = document.createElement('a');
      link.href = result.url;
      link.target = '_blank';
      link.rel = 'noopener';
      // Hint to browser to download (works for most file types)
      const ext = filePath.split('.').pop();
      link.download = `${fileName}.${ext}`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      showToast(lang === 'ar' ? '✓ بدأ التحميل' : '✓ Download started', '⬇');
    } else {
      showToast((lang === 'ar' ? 'فشل التحميل: ' : 'Download failed: ') + (result.error || ''), '✕');
    }
  } catch(err){
    console.error(err);
    showToast(lang === 'ar' ? 'حدث خطأ، حاول مرة أخرى' : 'Error, please try again', '✕');
  }

  // Restore button
  btn.disabled = false;
  btn.style.opacity = '';
  btn.style.cursor = '';
  btn.innerHTML = originalHtml;
}

function attachDownloadHandlers(){
  document.querySelectorAll('.download-btn[data-file]').forEach(btn => {
    btn.addEventListener('click', () => handleDownload(btn));
  });
}

document.addEventListener('DOMContentLoaded', () => {
  initLangSwitcher('success');
  renderSuccess();

  const nav = document.querySelector('nav');
  window.addEventListener('scroll', () => {
    nav.style.background = window.scrollY > 50 ? 'rgba(10,6,19,.9)' : 'rgba(10,6,19,.7)';
  });
});

document.addEventListener('langChanged', renderSuccess);
</script>
</body>
</html>
