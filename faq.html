<style>
  .faq-page{ padding: 8rem 0 5rem; }
  .faq-container{ max-width: 800px; margin: 0 auto; }

  .faq-header{
    text-align: center;
    margin-bottom: 4rem;
  }
  .faq-header h1{
    font-size: clamp(2rem, 5vw, 3.2rem);
    margin: 1rem 0;
  }
  .faq-header h1 .accent{
    background: linear-gradient(120deg, var(--gold), var(--violet-glow));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .faq-header > p{
    color: var(--ink-mute);
    font-size: 1.1rem;
    line-height: 1.7;
  }

  .faq-category{
    margin-bottom: 3rem;
  }
  .faq-category-title{
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1.4rem;
    color: var(--gold);
    margin-bottom: 1.2rem;
    padding-bottom: .7rem;
    border-bottom: 1px solid var(--line);
  }

  .faq-item{
    background: rgba(245,239,227,.04);
    border: 1px solid var(--line);
    border-radius: 16px;
    margin-bottom: .8rem;
    overflow: hidden;
    transition: all .3s;
  }
  .faq-item:hover{
    border-color: rgba(232,193,120,.3);
  }
  .faq-item.open{
    border-color: var(--gold);
    background: rgba(232,193,120,.04);
  }
  .faq-question{
    width: 100%;
    background: transparent;
    border: none;
    color: var(--ink);
    padding: 1.3rem 1.5rem;
    font-family: inherit;
    font-size: 1.02rem;
    font-weight: 600;
    text-align: start;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    transition: color .3s;
  }
  .faq-question:hover{ color: var(--gold); }
  .faq-item.open .faq-question{ color: var(--gold); }
  .faq-question .toggle-icon{
    width: 26px; height: 26px;
    border-radius: 50%;
    background: rgba(232,193,120,.15);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: transform .4s;
    font-size: 1.1rem;
    line-height: 1;
    color: var(--gold);
  }
  .faq-item.open .toggle-icon{
    transform: rotate(45deg);
    background: var(--gold);
    color: var(--bg-deep);
  }
  .faq-answer{
    max-height: 0;
    overflow: hidden;
    transition: max-height .4s ease;
  }
  .faq-item.open .faq-answer{
    max-height: 500px;
  }
  .faq-answer-inner{
    padding: 0 1.5rem 1.4rem;
    color: var(--ink-mute);
    line-height: 1.9;
  }

  .cta-banner{
    margin-top: 4rem;
    text-align: center;
    padding: 3rem 2rem;
    background: linear-gradient(135deg, rgba(232,193,120,.1), rgba(123,63,255,.1));
    border: 1px solid rgba(232,193,120,.3);
    border-radius: 24px;
  }
  .cta-banner h3{
    font-size: 1.5rem;
    margin-bottom: .7rem;
  }
  html[lang="ar"] .cta-banner h3{ font-family:'Reem Kufi', sans-serif; font-weight:600 }
  html[lang="en"] .cta-banner h3{ font-family:'Fraunces', serif; font-weight:600 }
  .cta-banner p{
    color: var(--ink-mute);
    margin-bottom: 1.5rem;
  }
</style>

        <div class="faq-item">
          <button class="faq-question">
            <span data-i18n="faq.q5"></span>

          </button>
          <div class="faq-answer"><div class="faq-answer-inner" data-i18n="faq.a5"></div></div>
        </div>

        <div class="faq-item">
          <button class="faq-question">
            <span data-i18n="faq.q6"></span>

      <!-- CTA Banner -->
      <div class="cta-banner">

<script>
// FAQ accordion
document.querySelectorAll('.faq-item').forEach(item => {
  const btn = item.querySelector('.faq-question');
  btn.addEventListener('click', () => {
    const wasOpen = item.classList.contains('open');
    document.querySelectorAll('.faq-item.open').forEach(i => i.classList.remove('open'));
    if(!wasOpen) item.classList.add('open');
  });
});

document.addEventListener('DOMContentLoaded', () => {
  initLangSwitcher();
  const nav = document.querySelector('nav');
  window.addEventListener('scroll', () => {
    nav.style.background = window.scrollY > 50 ? 'rgba(10,6,19,.9)' : 'rgba(10,6,19,.7)';
  });
});
</script>
